[project]
name = "undesirables-mcp-server"
version = "2.1.0"
description = "The Undesirables TCG Oracle as an MCP server: 22 focused tools for trading cards. Search 455K+ products, live market snapshots, AI grading, conformal-calibrated price forecasts with a public accuracy scorecard, card-collateral loan terms, fantasy and sports souls, all proven on-chain. Same tools as the hosted endpoint, over stdio. The local agent kit (memory, media, voice, code execution) ships as a second entry point."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "BSL-1.1"}
authors = [
    {name = "The Undesirables LLC", email = "theundesirables7@gmail.com"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "tcg",
    "trading-cards",
    "card-grading",
    "price-oracle",
    "risk-forecasting",
    "conformal-prediction",
    "collectibles",
    "nft",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "Pillow>=9.0",
    "ijson>=3.0",
    "typing-extensions>=4.0",
]

[project.urls]
Homepage = "https://the-undesirables.com"
Repository = "https://github.com/sailorpepe/undesirables-mcp-server"
Documentation = "https://the-undesirables.com/docs"
"Bug Tracker" = "https://github.com/sailorpepe/undesirables-mcp-server/issues"

[project.scripts]
undesirables-mcp = "oracle_server:main"
undesirables-mcp-server = "oracle_server:main"
undesirables-agent-kit = "boot_server:main"

[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "soxr>=0.3",
]
ml = [
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "sentence-transformers>=2.2",
]
vision = [
    "opencv-python>=4.8",
]
mac = [
    "mflux>=0.9.0",
]
windows = [
    "torch-directml>=0.2.0",
    "diffusers>=0.27.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
]
linux = [
    "torch>=2.0",
    "diffusers>=0.27.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
]
all = [
    "undesirables-mcp-server[audio,ml,vision]",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "oracle_server",
    "mcp_remote",
    "tccensus_client",
    "server",
    "boot_server",
    "execute_tool",
    "ebay_oracle",
    "tcg_oracle",
    "emotion_engine",
    "executor",
    "memory_graph",
    "rag_engine",
    "security",
    "voice_engine",
    "three_d_engine",
]

[tool.setuptools.package-data]
"*" = ["*.pyi", "*.md", "*.txt", "*.png", "*.sb"]
