[project]
name = "undesirables-mcp-server"
version = "1.0.0"
description = "Local-first AI agent MCP server — TCG card grading, Monte Carlo simulations, video production, music generation, image generation, and security scanning. Zero-trust architecture, everything runs on your machine."
requires-python = ">=3.11"
readme = "README.md"
license = "BSL-1.1"
authors = [
    {name = "The Undesirables LLC", email = "theundesirablesnft@gmail.com"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agent",
    "tcg",
    "card-grading",
    "monte-carlo",
    "local-ai",
    "ollama",
    "nft",
    "video-production",
    "music-generation",
    "image-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastmcp>=3.1.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "Pillow>=9.0",
    "ijson>=3.0",
    "typing-extensions>=4.0",
]

[project.urls]
Homepage = "https://the-undesirables.com"
Repository = "https://gitlab.com/meme-merchants/undesirables-mcp-server"
Documentation = "https://the-undesirables.com/docs"
"Bug Tracker" = "https://gitlab.com/meme-merchants/undesirables-mcp-server/-/issues"

[project.scripts]
undesirables-mcp = "boot_server:main"

[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "soxr>=0.3",
]
ml = [
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "sentence-transformers>=2.2",
]
vision = [
    "opencv-python>=4.8",
]
mac = [
    "mflux>=0.9.0",
]
windows = [
    "torch-directml>=0.2.0",
    "diffusers>=0.27.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
]
linux = [
    "torch>=2.0",
    "diffusers>=0.27.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
]
all = [
    "undesirables-mcp-server[audio,ml,vision]",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "server",
    "boot_server",
    "execute_tool",
    "ebay_oracle",
    "tcg_oracle",
    "emotion_engine",
    "executor",
    "memory_graph",
    "rag_engine",
    "security",
    "voice_engine",
    "three_d_engine",
]

[tool.setuptools.package-data]
"*" = ["*.pyi", "*.md", "*.txt", "*.png", "*.sb"]
