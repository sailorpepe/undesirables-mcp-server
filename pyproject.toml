[project]
name = "undesirables-mcp-server"
version = "1.0.0"
description = "The Undesirables — AI Agent MCP Server with video clipping, image generation, and security scanning"
requires-python = ">=3.11"

[project.dependencies]
fastmcp = "==3.1.1"
pydantic = "==2.12.5"
librosa = "==0.11.0"
numpy = "==2.4.2"
ijson = "==3.3.0"

# Apple Silicon only — MLX image generation
mflux = { version = ">=0.9.0", markers = "sys_platform == 'darwin' and platform_machine == 'arm64'" }

# Windows — DirectML for AMD/Intel GPU acceleration
torch-directml = { version = ">=0.2.0", markers = "sys_platform == 'win32'" }

# Linux — PyTorch with CUDA support
torch = { version = ">=2.0", markers = "sys_platform == 'linux'" }

# Cross-platform image generation (Windows + Linux)
diffusers = { version = ">=0.27.0", markers = "sys_platform != 'darwin'" }
transformers = { version = ">=4.36.0", markers = "sys_platform != 'darwin'" }
accelerate = { version = ">=0.25.0", markers = "sys_platform != 'darwin'" }
safetensors = { version = ">=0.4.0", markers = "sys_platform != 'darwin'" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
