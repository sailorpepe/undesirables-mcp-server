# ═══════════════════════════════════════════════════════════════
# The Undesirables MCP Server — GitLab CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════
# Schedule: Daily at 12:00 UTC (7:00 AM EST)
# Purpose:  Download TCGCSV price archives, compute drift/volatility
#           per card, and commit updated tcg_stats.json
# Runner:   Self-hosted Mac Mini (shell executor)
# ═══════════════════════════════════════════════════════════════

stages:
  - update

tcg_daily_snapshot:
  stage: update
  # No Docker image — runs natively on Mac Mini shell executor
  # image: python:3.12-slim  (removed for macOS shell executor)

  # Only run on schedule or manual trigger (never on push/MR)
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

  before_script:
    - export PATH="/opt/homebrew/bin:$PATH"
    - python3 --version
    - 7za --version || echo "WARNING 7za not found"
    - git config --global user.name "gitlab-ci[bot]"
    - git config --global user.email "ci-bot@gitlab.com"
    - git checkout $CI_COMMIT_REF_NAME || git checkout -b $CI_COMMIT_REF_NAME
    - git pull origin $CI_COMMIT_REF_NAME --rebase || true

  script:
    - export PATH="/opt/homebrew/bin:$PATH"
    - echo "🚀 Starting TCGCSV daily snapshot..."
    - python3 scripts/tcg_cron.py
    - echo "✅ JSON snapshot complete. Importing to SQLite..."
    - python3 scripts/import_to_sqlite.py
    - echo "✅ SQLite import complete. Syncing to Vercel KV..."
    - python3 scripts/sync_to_vercel_kv.py || echo "⚠️ KV sync skipped (missing env vars or connection issue)"
    - echo "📦 Exporting and pushing to Kaggle..."
    - python3 scripts/kaggle_export.py --output /tmp/kaggle_daily --push || echo "⚠️ Kaggle push failed (check KAGGLE_USERNAME/KAGGLE_KEY)"
    - echo "✅ Pipeline complete."

  # NOTE: data/tcg_stats.json (~36MB) is a pipeline artifact — intentionally NOT
  # committed to git (it's gitignored + kept only as the CI artifact below). The old
  # daily auto-commit/push was adding 1.2M-line commits on every run; removed.

  # Cache archives between runs to avoid re-downloading
  cache:
    key: tcg-archives
    paths:
      - tmp_archives/

  # Keep the stats file as an artifact for download
  artifacts:
    paths:
      - data/tcg_stats.json
    expire_in: 7 days
